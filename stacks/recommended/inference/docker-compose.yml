name: inference

# Local inference — run models on your own box. Ollama serves models; Open WebUI
# is the chat UI. Both public images. See README.md for credit.
#
# GPU acceleration is best-effort on Docker Desktop (macOS/Windows); on Linux
# with the NVIDIA Container Toolkit, add a `deploy.resources` GPU reservation.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    healthcheck:
      # Ollama ships no curl; its own CLI queries the local server.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${AGENTSTACK_DATA:-./data}/ollama:/root/.ollama
    ports:
      - "${BIND_ADDR:-127.0.0.1}:11434:11434"
    networks:
      - agentstack

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    environment:
      TZ: ${TZ:-UTC}
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY:-}
    volumes:
      - ${AGENTSTACK_DATA:-./data}/open-webui:/app/backend/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3101:8080"
    depends_on:
      - ollama
    networks:
      - agentstack

networks:
  agentstack:
    external: true
    name: agentstack
